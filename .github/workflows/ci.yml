name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Build deps for the engine: vendored SDL2 (cmake + X11/GL headers) and rodio (ALSA).
      - run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y cmake pkg-config libasound2-dev libudev-dev libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev
      - run: cargo test --workspace
